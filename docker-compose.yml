services:

  database:
    image: postgres:16.15
    container_name: shortenit-database
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5431:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    container_name: shortenit-migrate
    volumes:
      - ./internal/db/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:postgres@database:5432/main?sslmode=disable"
      - "up"
    depends_on:
      database:
        condition: service_healthy

  api:
    container_name: shortenit-api
    build: .
    ports:
      - 8080:8080
    environment:
      - DB_URL=postgres://postgres:postgres@database:5432/main?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully      

volumes:
  db-data: